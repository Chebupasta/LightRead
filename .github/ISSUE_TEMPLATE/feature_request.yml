name: Предложение функции
description: Предложить улучшение или новую возможность
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Какая проблема решается
      description: Опишите сценарий, которого сейчас не хватает
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Предлагаемое решение
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Альтернативы
      description: Какие обходные пути вы пробовали

  - type: dropdown
    id: area
    attributes:
      label: Область
      options:
        - Библиотека
        - Чтение / рендер
        - PDF
        - Заметки
        - TTS
        - Синхронизация
        - Интерфейс
        - Другое
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Дополнительный контекст
      description: Скриншоты, примеры книг, ссылки на спецификации
